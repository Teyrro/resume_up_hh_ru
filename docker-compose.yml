services:
  hh-autoraise:
    # Готовый образ из GitHub Container Registry (собирается GitHub Actions при пуше в master).
    # Без исходников: docker compose pull. Из исходников: docker compose build.
    image: ghcr.io/teyrro/resume_up_hh_ru:latest
    build: .
    container_name: hh-autoraise
    restart: unless-stopped
    env_file: .env
    environment:
      # Часовой пояс — из файла переменных (TZ=...), иначе Новосибирск.
      TZ: ${TZ:-Asia/Novosibirsk}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    init: true
    shm_size: "256m"
    # Chromium запускается только на время прохода; лимит защищает соседние сервисы (xray).
    mem_limit: 700m
    networks:
      - hh-autoraise
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hh-autoraise:
    name: hh-autoraise
    driver: bridge
